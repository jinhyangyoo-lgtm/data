<script>
/* ===== 6. 연간 현황 ===== */
const yv={mode:'sum',paidOnly:false};
function yearData(y){
  const map=new Map();
  for(let m=0;m<12;m++)for(const per of[1,2]){
    for(const r of calc(ymk(y,m),per).rows){
      let e=map.get(r.p.name);if(!e){e={p:r.p,mo:Array(12).fill(null)};map.set(r.p.name,e)}
      const a=e.mo[m]||(e.mo[m]={days:0,base:0,allow:0,alba:0,total:0});a.days+=r.days;
      if(!yv.paidOnly||r.paid){a.base+=r.base;a.allow+=r.allow;a.alba+=r.alba;a.total+=r.total}
    }
  }
  const g=groups();return[...map.values()].sort((a,b)=>g.indexOf(a.p.grp)-g.indexOf(b.p.grp));
}
const KEYS=['days','base','allow','alba','total'];
function yCell(a,p){
  if(!a)return`<span class="na">${p&&p.grp===S.cfg.seasonGroup?'미사용':'–'}</span>`;
  if(yv.mode==='sum')return`<div class="yc"><b class="${a.days?'':'na'}">${a.days?num(a.days)+'일':'–'}</b><small>${a.total?won(a.total):''}</small></div>`;
  const v=a[yv.mode];return v?(yv.mode==='days'?num(v)+'일':won(v)):'<span class="na">–</span>';
}
function renderYear(){
  const y=view.y,data=yearData(y),cm=y===NOW.getFullYear()?NOW.getMonth():-1;
  $('#title').textContent=`${y}년`;
  const sumAll=KEYS.map(k=>data.reduce((s,e)=>s+e.mo.reduce((t,a)=>t+(a?a[k]:0),0),0));
  const modes={sum:'종합 (일수·총액)',days:'근무일수',base:'급여',allow:'수당',alba:'알바비',total:'총 지급액'};
  let h=`<div class="sum"><div><small>연간 환산 근무일</small><b>${num(sumAll[0])}일</b></div><div><small>급여</small><b>₩${won(sumAll[1])}</b></div><div><small>수당</small><b>₩${won(sumAll[2])}</b></div><div><small>알바비</small><b>₩${won(sumAll[3])}</b></div><div class="okc"><small>총 지급액</small><b>₩${won(sumAll[4])}</b></div></div>
   <div class="bulk"><div class="seg2">${Object.entries(modes).map(([k,v])=>`<button data-ym="${k}" class="${yv.mode===k?'on':''}">${v}</button>`).join('')}</div>
   <label><input type="checkbox" id="paidOnly" ${yv.paidOnly?'checked':''}> 지급완료분만 집계</label><button class="sp" id="ycsv" style="margin-left:auto">CSV 내려받기</button></div>
   <div class="card tbl"><table class="ytbl"><thead><tr><th class="l c1">이름</th>${Array.from({length:12},(_,i)=>`<th class="${i===cm?'cur':''}">${i+1}월</th>`).join('')}<th class="tt">연 합계</th></tr></thead><tbody>`;
  groups().forEach(g=>{
    const es=data.filter(e=>e.p.grp===g);if(!es.length)return;
    h+=`<tr class="gr"><td class="c1" colspan="14">${esc(g)}</td></tr>`;
    es.forEach(e=>{
      const t=e.mo.reduce((s,a)=>{if(a)KEYS.forEach(k=>s[k]+=a[k]);return s},{days:0,base:0,allow:0,alba:0,total:0});
      h+=`<tr><td class="l c1"><b>${esc(e.p.name)}</b>${e.p.active===false?'<small>비활성</small>':''}</td>${e.mo.map((a,i)=>`<td class="${i===cm?'cur':''}">${yCell(a,e.p)}</td>`).join('')}<td class="tt">${yCell(t)}</td></tr>`;
    });
  });
  const colT=Array.from({length:12},(_,m)=>data.reduce((s,e)=>{const a=e.mo[m];if(a)KEYS.forEach(k=>s[k]+=a[k]);return s},{days:0,base:0,allow:0,alba:0,total:0}));
  const all=colT.reduce((s,a)=>{KEYS.forEach(k=>s[k]+=a[k]);return s},{days:0,base:0,allow:0,alba:0,total:0});
  $('#v-year').innerHTML=h+`</tbody><tfoot><tr><td class="l c1">월 합계</td>${colT.map(a=>`<td>${yCell(a)}</td>`).join('')}<td class="tt">${yCell(all)}</td></tr></tfoot></table></div>
   <div class="hint">금액은 근무기록 × 일당 + 수당 + 알바비 기준이며 계절근로를 비활성화한 기간은 '미사용'으로 표시됩니다.</div>`;
}
$('#v-year').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ym){yv.mode=b.dataset.ym;renderYear()}
  else if(b.id==='ycsv'){
    const rows=[['이름','구분',...Array.from({length:12},(_,i)=>[`${i+1}월 일수`,`${i+1}월 급여`,`${i+1}월 수당`,`${i+1}월 알바비`]).flat(),'합계 일수','합계 급여','합계 수당','합계 알바비','합계 총액']];
    yearData(view.y).forEach(e=>{const t=Array(5).fill(0);const cells=e.mo.flatMap(a=>{if(!a)return['','','',''];KEYS.forEach((k,i)=>t[i]+=a[k]);return[a.days,a.base,a.allow,a.alba]});rows.push([e.p.name,e.p.grp,...cells,...t])});
    dl(`연간현황-${view.y}.csv`,'﻿'+rows.map(r=>r.join(',')).join('\n'),'text/csv');
  }
});
$('#v-year').addEventListener('change',e=>{if(e.target.id==='paidOnly'){yv.paidOnly=e.target.checked;renderYear()}});
</script>
<script>'END-OF-app6';</script>

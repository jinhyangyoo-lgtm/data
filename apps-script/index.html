<body>
<header class="top">
  <div class="brand">인력관리<button class="sync" id="sync"></button></div>
  <nav id="nav">
    <button data-tab="cal" class="on">캘린더</button><button data-tab="pay">급여 지급</button>
    <button data-tab="year">연간 현황</button><button data-tab="set">설정</button>
  </nav>
</header>
<main>
  <div class="bar" id="bar">
    <button id="prev">◀</button><h2 id="title"></h2><button id="next">▶</button><button id="today">오늘</button>
    <div class="legend" id="legend">
      <span><i class="sw full"></i>전일</span><span><i class="sw half"></i>반일</span><span><i class="sw part"></i>시간제</span>
      <span><i class="sw off"></i>휴무일</span><span><i class="sw pay"></i>급여일</span>
    </div>
  </div>
  <section id="v-cal">
    <div class="kpi" id="kpi"></div>
    <div class="calwrap"><div class="card"><div class="cal" id="cal"></div></div><aside class="card side" id="panel"></aside></div>
  </section>
  <section id="v-pay" hidden></section>
  <section id="v-year" hidden></section>
  <section id="v-set" hidden></section>
</main>
<dialog id="dlg"><form method="dialog" id="addForm">
  <h3 style="margin:0">직원 추가</h3>
  <label>이름</label><input id="aName" required>
  <label>국적</label><input id="aNat">
  <label>구분 (그룹)</label><input id="aGrp" list="grpList" required><datalist id="grpList"></datalist>
  <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button value="cancel" formnovalidate>취소</button><button class="pri" value="ok">추가</button></div>
</form></dialog>

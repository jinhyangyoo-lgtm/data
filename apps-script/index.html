<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인력관리 대시보드</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;
  --full:#2563eb;--full-bg:#dbeafe;
  --half:#16a34a;--half-bg:#dcfce7;
  --part:#ea580c;--part-bg:#ffedd5;
  --accent:#111827;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1115;--card:#181b22;--ink:#e5e7eb;--mute:#9ca3af;--line:#2a2f3a;
  --full:#60a5fa;--full-bg:#1e3a8a55;--half:#4ade80;--half-bg:#14532d66;--part:#fb923c;--part-bg:#7c2d1266;--accent:#e5e7eb}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--bg)}
button.primary{background:var(--accent);color:var(--card);border-color:var(--accent)}
nav button.on{background:var(--accent);color:var(--card);border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:16px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar h2{margin:0;font-size:17px;min-width:120px;text-align:center}
.legend{display:flex;gap:12px;margin-left:auto;font-size:12px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);overflow:hidden}
.dow{padding:6px;text-align:center;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line)}
.dow:first-child,.day.sun .num{color:#dc2626}
.dow:nth-child(7),.day.sat .num{color:#2563eb}
.day{min-height:104px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.day:nth-child(7n){border-right:0}
.day:hover{background:var(--bg)}
.day.other{opacity:.35}
.day.today .num{background:var(--accent);color:var(--card);border-radius:10px;padding:0 6px}
.day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.num{font-size:12px;align-self:flex-start;margin-bottom:2px}
.chip{font-size:11px;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid}
.chip.full{background:var(--full-bg);border-color:var(--full);color:var(--full)}
.chip.half{background:var(--half-bg);border-color:var(--half);color:var(--half)}
.chip.part{background:var(--part-bg);border-color:var(--part);color:var(--part)}
.chip .memo{opacity:.8}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:3px}
.dot.full{background:var(--full)}.dot.half{background:var(--half)}.dot.part{background:var(--part)}
.panel{margin-top:16px;padding:14px}
.panel h3{margin:0 0 4px;font-size:16px}
.group{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);flex-wrap:wrap}
.ghead b{margin-right:auto}
.ghead select{padding:4px}
.row{display:grid;grid-template-columns:24px 110px 110px 80px 1fr;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--line)}
.row .nm small{color:var(--mute)}
.row input[type=text],.row input[type=number],.row select{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.row input:disabled,.row select:disabled{opacity:.4}
@media(max-width:640px){
  .row{grid-template-columns:24px 1fr 1fr;}
  .row .memo,.row .hrs{grid-column:2 / 4}
  .day{min-height:70px}.chip{font-size:10px;padding:0 3px}
  .legend{margin-left:0}
}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{font-size:12px;color:var(--mute);font-weight:600}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card h3{margin:0;padding:12px 14px;font-size:15px;border-bottom:1px solid var(--line)}
.card h3 small{color:var(--mute);font-weight:400;margin-left:6px}
.scroll{overflow-x:auto}
.hint{color:var(--mute);font-size:12px;margin:6px 2px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:420px;width:92%}
dialog label{display:block;margin:8px 0 2px;font-size:12px;color:var(--mute)}
dialog input,dialog select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.hidden{display:none}
.stat{font-size:12px;padding:2px 8px;border-radius:12px;margin-left:8px;vertical-align:2px;color:var(--mute)}
.stat.ok{color:var(--half)}.stat.err{color:#dc2626;border-color:#dc2626}.stat.busy{color:var(--part)}
.cfg label{display:block;margin:8px 0 2px;font-size:12px;color:var(--mute)}
.cfg input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
details{margin-top:10px}details ol{padding-left:20px;margin:6px 0}code{background:var(--bg);padding:1px 4px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>인력관리 대시보드 <button id="sstat" class="stat" title="클릭: 지금 동기화"></button></h1>
  <nav>
    <button data-tab="cal" class="on">캘린더·근무입력</button>
    <button data-tab="month">월별 합계</button>
    <button data-tab="pay">급여 기간별 합계</button>
    <button data-tab="staff">직원 관리</button>
  </nav>
</header>
<main>
  <div class="bar" id="monthbar">
    <button id="prev">◀</button><h2 id="mtitle"></h2><button id="next">▶</button>
    <button id="goToday">오늘</button>
    <div class="legend">
      <span><i class="dot full"></i>전일</span><span><i class="dot half"></i>반일</span><span><i class="dot part"></i>시간제</span>
    </div>
  </div>

  <section id="tab-cal">
    <div class="card cal" id="cal"></div>
    <div class="card panel" id="panel"></div>
  </section>

  <section id="tab-month" class="hidden"></section>
  <section id="tab-pay" class="hidden"></section>
  <section id="tab-staff" class="hidden"></section>
</main>

<dialog id="dlg">
  <form method="dialog" id="addForm">
    <h3 style="margin-top:0">직원 추가</h3>
    <label>이름</label><input id="aName" required>
    <label>국적</label><input id="aNat">
    <label>구분</label><input id="aGrp" list="grpList" required><datalist id="grpList"></datalist>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
      <button value="cancel" formnovalidate>취소</button><button class="primary" value="ok">추가</button>
    </div>
  </form>
</dialog>

<script>
const TYPES={full:'전일',half:'반일',part:'시간제'};
const WEIGHT={full:1,half:0.5,part:0};
const KEY='hr-dashboard-v1';
const DEFAULT_STAFF=[
  {name:'조',nat:'태국',grp:'상근',memo:''},{name:'짙',nat:'태국',grp:'상근',memo:''},
  {name:'파이',nat:'태국',grp:'상근',memo:''},{name:'짱',nat:'베트남',grp:'계절',memo:''},
  {name:'유이',nat:'베트남',grp:'계절',memo:''},{name:'푄',nat:'태국',grp:'예비',memo:''},
  {name:'놈',nat:'태국',grp:'예비',memo:''}];

let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!db.staff)db={staff:DEFAULT_STAFF,rec:{}};   // rec[date][name]={type,hours,memo}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};

/* ---------- Google Sheets 동기화 (Apps Script 웹앱) ---------- */
const CFG_KEY='hr-dashboard-sheet',DIRTY_KEY='hr-dashboard-dirty';
// Apps Script 웹앱 안에서 열린 경우(google.script.run 사용 가능) 별도 URL 설정 없이 바로 시트와 연동
const HOSTED=typeof google!=='undefined'&&!!google.script&&!!google.script.run;
let cfg={};try{cfg=JSON.parse(localStorage.getItem(CFG_KEY))||{}}catch(e){}
if(HOSTED)cfg={url:'hosted',token:''};
const gs=(fn,...a)=>new Promise((ok,ng)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>ng(new Error(e&&e.message||e)))[fn](...a));
const sync={days:new Set(),staff:false,all:false,busy:false,state:cfg.url?'busy':'off',msg:'',timer:null};
try{const d=JSON.parse(localStorage.getItem(DIRTY_KEY)||'{}');(d.days||[]).forEach(x=>sync.days.add(x));sync.staff=!!d.staff;sync.all=!!d.all}catch(e){}
const saveDirty=()=>{try{localStorage.setItem(DIRTY_KEY,JSON.stringify({days:[...sync.days],staff:sync.staff,all:sync.all}))}catch(e){}};
function setStatus(state,msg=''){
  sync.state=state;sync.msg=msg;
  const b=document.getElementById('sstat');if(!b)return;
  const t={off:'로컬 저장만',busy:'시트 동기화 중…',ok:'✔ Google Sheets 동기화됨',err:'⚠ 동기화 실패 (클릭하여 재시도)'}[state];
  b.textContent=t;b.className='stat '+(state==='ok'?'ok':state==='err'?'err':state==='busy'?'busy':'');
  b.title=msg||'클릭: 지금 동기화';
}
async function api(body){
  if(HOSTED)return gs('apiCall',body);
  const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.token||'',...body})});
  const j=await r.json();if(j.error)throw new Error(j.error);return j;
}
async function fetchAll(){
  if(HOSTED)return gs('apiRead');
  const u=cfg.url+(cfg.url.includes('?')?'&':'?')+'token='+encodeURIComponent(cfg.token||'');
  const j=await (await fetch(u)).json();if(j.error)throw new Error(j.error);return j;
}
function markDay(d){if(cfg.url){sync.days.add(d);saveDirty();queueFlush()}}
function markStaff(){if(cfg.url){sync.staff=true;saveDirty();queueFlush()}}
function markAll(){if(cfg.url){sync.all=true;saveDirty();queueFlush()}}
function queueFlush(){if(!cfg.url)return;setStatus('busy');clearTimeout(sync.timer);sync.timer=setTimeout(flush,600)}
async function flush(){
  if(!cfg.url)return true;
  if(sync.busy){queueFlush();return false}
  if(!sync.days.size&&!sync.staff&&!sync.all){setStatus('ok');return true}
  sync.busy=true;setStatus('busy');
  // 보낼 목록을 먼저 떼어내고, 실패하면 되돌린다 (전송 중 새로 바뀐 날짜는 그대로 남음)
  const days=[...sync.days],staff=sync.staff,all=sync.all;
  sync.days.clear();sync.staff=false;sync.all=false;saveDirty();
  try{
    if(all)await api({action:'setAll',staff:db.staff,rec:db.rec});
    else{
      if(staff)await api({action:'setStaff',staff:db.staff});
      for(const d of days)await api({action:'setDay',date:d,entries:db.rec[d]||{}});
    }
    sync.busy=false;
    if(sync.days.size||sync.staff||sync.all)return flush();
    setStatus('ok');return true;
  }catch(e){
    days.forEach(d=>sync.days.add(d));sync.staff=sync.staff||staff;sync.all=sync.all||all;saveDirty();
    sync.busy=false;setStatus('err',e.message);return false;
  }
}
async function pullFromSheet(){
  if(!cfg.url)return;
  setStatus('busy');
  try{
    if(sync.days.size||sync.staff||sync.all){if(!await flush())return}   // 미전송 변경분 먼저 올림
    const j=await fetchAll();
    if(!j.staff.length&&!Object.keys(j.rec).length){markAll();await flush()}  // 빈 시트: 현재 데이터를 올려 초기화
    else{db={staff:j.staff,rec:j.rec};save();renderAll()}
    setStatus('ok');
  }catch(e){setStatus('err',e.message)}
}

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ds=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>Number.isInteger(n)?n:n.toFixed(1);
const now=new Date();
let view={y:now.getFullYear(),m:now.getMonth()};
let sel=ds(now.getFullYear(),now.getMonth(),now.getDate());
let tab='cal';
let bulkType={};   // 구분별 일괄 입력 시 사용할 근무형태

const groups=()=>[...new Set(db.staff.map(s=>s.grp))];
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();

/* ---------- 캘린더 ---------- */
function renderCal(){
  $('#mtitle').textContent=`${view.y}년 ${view.m+1}월`;
  const first=new Date(view.y,view.m,1).getDay(), n=daysIn(view.y,view.m);
  let h=['일','월','화','수','목','금','토'].map(d=>`<div class="dow">${d}</div>`).join('');
  const todayS=ds(now.getFullYear(),now.getMonth(),now.getDate());
  const total=Math.ceil((first+n)/7)*7;
  for(let i=0;i<total;i++){
    const d=new Date(view.y,view.m,1-first+i);
    const k=ds(d.getFullYear(),d.getMonth(),d.getDate());
    const other=d.getMonth()!==view.m, dw=d.getDay();
    const r=db.rec[k]||{};
    const chips=db.staff.filter(s=>r[s.name]).map(s=>{
      const x=r[s.name];
      const label=x.type==='part'?`${s.name} ${x.hours?x.hours+'h':'시간제'}`:`${s.name} ${x.type==='half'?'반':''}`;
      return `<div class="chip ${x.type}" title="${esc(s.name)} ${TYPES[x.type]}${x.memo?' · '+esc(x.memo):''}">${esc(label)}${x.memo?' <span class="memo">📝</span>':''}</div>`;
    }).join('');
    h+=`<div class="day ${other?'other':''} ${k===todayS?'today':''} ${k===sel?'sel':''} ${dw===0?'sun':dw===6?'sat':''}" data-d="${k}"><span class="num">${d.getDate()}</span>${chips}</div>`;
  }
  $('#cal').innerHTML=h;
  $('#cal').querySelectorAll('.day').forEach(e=>e.onclick=()=>{sel=e.dataset.d;const d=new Date(sel);if(d.getMonth()!==view.m){view={y:d.getFullYear(),m:d.getMonth()}}renderCal();renderPanel()});
}

/* ---------- 일별 입력 패널 ---------- */
function renderPanel(){
  const r=db.rec[sel]||{};
  const d=new Date(sel+'T00:00');
  const cnt=Object.keys(r).length;
  let h=`<h3>${sel} (${'일월화수목금토'[d.getDay()]}) 근무 입력 <small style="font-weight:400;color:var(--mute)">· 출근 ${cnt}명</small></h3>
  <div class="hint">체크하면 출근으로 기록되며 기본값은 전일근무입니다. 사람별로 반일·시간제로 바꾸거나 메모를 남길 수 있습니다.</div>`;
  for(const g of groups()){
    const members=db.staff.filter(s=>s.grp===g);
    const bt=bulkType[g]||'full';
    h+=`<div class="group"><div class="ghead"><b>${esc(g)} <span style="color:var(--mute);font-weight:400">(${members.length}명)</span></b>
      <select data-bt="${esc(g)}">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===bt?'selected':''}>${v}</option>`).join('')}</select>
      <button data-all="${esc(g)}">전원 출근 입력</button><button data-none="${esc(g)}">전원 해제</button></div>`;
    for(const s of members){
      const x=r[s.name];
      h+=`<div class="row" data-n="${esc(s.name)}">
        <input type="checkbox" ${x?'checked':''} data-f="on">
        <div class="nm"><b>${esc(s.name)}</b> <small>${esc(s.nat)}</small></div>
        <select data-f="type" ${x?'':'disabled'}>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${x&&x.type===k?'selected':''}>${v}</option>`).join('')}</select>
        <div class="hrs"><input type="number" data-f="hours" min="0" max="24" step="0.5" placeholder="시간" value="${x&&x.hours||''}" ${x&&x.type==='part'?'':'disabled'}></div>
        <div class="memo"><input type="text" data-f="memo" placeholder="메모" value="${esc(x&&x.memo)}" ${x?'':'disabled'}></div>
      </div>`;
    }
    h+='</div>';
  }
  $('#panel').innerHTML=h;
}
function setRec(name,x){
  db.rec[sel]=db.rec[sel]||{};
  if(x)db.rec[sel][name]=x;else delete db.rec[sel][name];
  if(!Object.keys(db.rec[sel]).length)delete db.rec[sel];
  markDay(sel);
}
$('#panel').addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.bt){bulkType[t.dataset.bt]=t.value;return}
  const row=t.closest('.row');if(!row)return;
  const name=row.dataset.n,f=t.dataset.f;
  const cur=(db.rec[sel]||{})[name];
  if(f==='on')setRec(name,t.checked?{type:'full',hours:'',memo:''}:null);
  else if(cur){
    if(f==='type'){cur.type=t.value;if(t.value!=='part')cur.hours=''}
    else cur[f]=t.value;
  }
  save();renderCal();renderPanel();
  if(f==='memo'||f==='hours')row.querySelector(`[data-f=${f}]`)?.focus();
});
$('#panel').addEventListener('click',e=>{
  const g=e.target.dataset.all??e.target.dataset.none;
  if(g===undefined)return;
  const all=e.target.dataset.all!==undefined;
  db.staff.filter(s=>s.grp===g).forEach(s=>{
    if(all){const old=(db.rec[sel]||{})[s.name];if(!old)setRec(s.name,{type:bulkType[g]||'full',hours:'',memo:''})}
    else setRec(s.name,null);
  });
  save();renderCal();renderPanel();
});

/* ---------- 집계 ---------- */
function summarize(y,m,from,to){
  const out=db.staff.map(s=>({s,full:0,half:0,part:0,hours:0,eq:0}));
  const idx=Object.fromEntries(out.map(o=>[o.s.name,o]));
  for(let d=from;d<=to;d++){
    const r=db.rec[ds(y,m,d)];if(!r)continue;
    for(const [name,x] of Object.entries(r)){
      const o=idx[name];if(!o)continue;
      o[x.type]++;o.eq+=WEIGHT[x.type];if(x.type==='part')o.hours+=Number(x.hours)||0;
    }
  }
  return out;
}
function table(rows){
  const t=rows.reduce((a,o)=>({full:a.full+o.full,half:a.half+o.half,part:a.part+o.part,hours:a.hours+o.hours,eq:a.eq+o.eq}),{full:0,half:0,part:0,hours:0,eq:0});
  return `<div class="scroll"><table><thead><tr><th>이름</th><th>구분</th>
    <th style="color:var(--full)">전일(일)</th><th style="color:var(--half)">반일(일)</th><th style="color:var(--part)">시간제(일)</th><th style="color:var(--part)">시간제(시간)</th><th>환산 근무일</th></tr></thead><tbody>
    ${rows.map(o=>`<tr><td>${esc(o.s.name)}</td><td>${esc(o.s.grp)}</td><td>${o.full}</td><td>${o.half}</td><td>${o.part}</td><td>${num(o.hours)}</td><td><b>${num(o.eq)}</b></td></tr>`).join('')}
    </tbody><tfoot><tr><td>합계</td><td></td><td>${t.full}</td><td>${t.half}</td><td>${t.part}</td><td>${num(t.hours)}</td><td>${num(t.eq)}</td></tr></tfoot></table></div>`;
}
function renderMonth(){
  const n=daysIn(view.y,view.m);
  $('#tab-month').innerHTML=`<div class="card"><h3>${view.y}년 ${view.m+1}월 직원별 근무 합계<small>1일 ~ ${n}일</small></h3>${table(summarize(view.y,view.m,1,n))}</div>
  <div class="hint">환산 근무일 = 전일 1일 + 반일 0.5일 (시간제는 일수·시간을 따로 집계)</div>`;
}
function renderPay(){
  const n=daysIn(view.y,view.m);
  $('#tab-pay').innerHTML=`<div class="grid2">
    <div class="card"><h3>1일 ~ 15일<small>${view.m+1}/15 지급분</small></h3>${table(summarize(view.y,view.m,1,15))}</div>
    <div class="card"><h3>16일 ~ ${n}일<small>${view.m+1}/${n} 지급분</small></h3>${table(summarize(view.y,view.m,16,n))}</div></div>
  <div class="hint">환산 근무일 = 전일 1일 + 반일 0.5일 (시간제는 일수·시간을 따로 집계)</div>`;
}

/* ---------- 직원 관리 ---------- */
function cfgCard(){return `<div class="card cfg" style="margin-top:16px;padding:14px"><b>Google Sheets 연결</b>
  <div class="hint">연결하면 입력 내용이 구글 시트에 자동 저장되고, 어느 기기에서 열어도 같은 데이터를 봅니다.</div>
  <label>웹앱 URL (Apps Script 배포 주소)</label><input id="cUrl" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(cfg.url||'')}">
  <label>비밀 토큰 (Code.gs의 TOKEN과 동일, 없으면 비워두기)</label><input id="cTok" value="${esc(cfg.token||'')}">
  <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="primary" id="cSave">연결·저장</button><button id="cPull">시트에서 다시 불러오기</button><button id="cPush">현재 데이터를 시트에 덮어쓰기</button><button id="cOff">연결 해제</button></div>
  <details><summary>설정 방법</summary><ol>
    <li>구글 시트를 새로 만든다.</li>
    <li>메뉴 <b>확장 프로그램 → Apps Script</b>를 열고 저장소의 <code>apps-script/Code.gs</code> 내용을 붙여넣는다. (원하면 <code>TOKEN</code>에 비밀 문자열 입력)</li>
    <li><b>배포 → 새 배포 → 유형: 웹 앱</b>, 실행 사용자 <b>나</b>, 액세스 권한 <b>모든 사용자</b>로 배포하고 권한을 승인한다.</li>
    <li>발급된 <code>/exec</code> URL을 위 칸에 붙여넣고 <b>연결·저장</b>을 누른다. 시트가 비어 있으면 현재 데이터가 자동으로 올라간다.</li>
  </ol><div class="hint">시트의 '직원', '근무기록' 탭이 자동 생성됩니다. 시트에서 직접 수정한 내용은 "시트에서 다시 불러오기"(또는 새로고침)로 반영됩니다.</div></details></div>`}
function renderStaff(){
  $('#tab-staff').innerHTML=`<div class="card"><h3>직원 목록 <button id="addBtn" class="primary" style="float:right;padding:3px 10px">+ 직원 추가</button></h3>
  <div class="scroll"><table><thead><tr><th>이름</th><th>구분</th><th>국적</th><th></th></tr></thead><tbody>
  ${db.staff.map((s,i)=>`<tr><td>${esc(s.name)}</td><td>${esc(s.grp)}</td><td style="text-align:left">${esc(s.nat)}</td><td><button data-del="${i}">삭제</button></td></tr>`).join('')}
  </tbody></table></div></div>
  ${HOSTED?'<div class="card" style="margin-top:16px;padding:14px"><b>Google Sheets</b><div class="hint">이 페이지는 Apps Script 웹앱으로 실행 중이며, 입력 내용은 연결된 구글 시트(\'직원\', \'근무기록\' 탭)에 자동 저장됩니다.</div></div>':cfgCard()}
  <div class="card" style="margin-top:16px;padding:14px"><b>데이터 백업</b>
  <div class="hint">데이터는 이 브라우저에 저장됩니다. 다른 기기로 옮기거나 보관하려면 백업 파일을 내려받으세요.</div>
  <button id="exp">백업 내려받기 (JSON)</button> <button id="expCsv">이번 달 합계 CSV</button>
  <label class="hint" style="display:inline-block;margin-left:8px">복원: <input type="file" id="imp" accept=".json"></label></div>`;
  $('#addBtn').onclick=()=>{$('#grpList').innerHTML=groups().map(g=>`<option value="${esc(g)}">`).join('');$('#dlg').showModal()};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const s=db.staff[b.dataset.del];
    if(confirm(`${s.name} 직원을 목록에서 삭제할까요? (기존 근무기록은 남지만 집계에는 나타나지 않습니다)`)){db.staff.splice(b.dataset.del,1);save();markStaff();renderStaff()}
  });
  if(!HOSTED){
  $('#cSave').onclick=()=>{
    const url=$('#cUrl').value.trim();
    if(!/^https:\/\/script\.google\.com\//.test(url)){alert('Apps Script 웹앱 URL(https://script.google.com/...)을 입력하세요.');return}
    cfg={url,token:$('#cTok').value.trim()};localStorage.setItem(CFG_KEY,JSON.stringify(cfg));pullFromSheet();
  };
  $('#cPull').onclick=()=>{if(!cfg.url)return alert('먼저 연결하세요.');if(confirm('시트 내용으로 현재 화면 데이터를 교체할까요?'))pullFromSheet()};
  $('#cPush').onclick=async()=>{if(!cfg.url)return alert('먼저 연결하세요.');if(confirm('현재 데이터로 시트 내용을 모두 덮어쓸까요?')){markAll();await flush()}};
  $('#cOff').onclick=()=>{if(confirm('연결을 해제할까요? (시트 데이터는 그대로 남습니다)')){cfg={};localStorage.removeItem(CFG_KEY);sync.days.clear();sync.staff=sync.all=false;saveDirty();setStatus('off');renderStaff()}};
  }
  $('#exp').onclick=()=>download('hr-backup.json',JSON.stringify(db),'application/json');
  $('#expCsv').onclick=()=>{
    const n=daysIn(view.y,view.m);
    const row=(label,a,b)=>summarize(view.y,view.m,a,b).map(o=>[label,o.s.name,o.s.grp,o.full,o.half,o.part,o.hours,o.eq].join(','));
    const csv='﻿기간,이름,구분,전일,반일,시간제일수,시간제시간,환산근무일\n'+[...row('1~15일',1,15),...row(`16~${n}일`,16,n)].join('\n');
    download(`근무합계-${view.y}-${pad(view.m+1)}.csv`,csv,'text/csv');
  };
  $('#imp').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    f.text().then(t=>{const d=JSON.parse(t);if(!d.staff||!d.rec)throw 0;if(confirm('현재 데이터를 백업 파일 내용으로 덮어쓸까요?')){db=d;save();markAll();renderAll()}}).catch(()=>alert('올바른 백업 파일이 아닙니다.'));
  };
}
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();
}
$('#addForm').addEventListener('submit',e=>{
  if(e.submitter.value!=='ok')return;
  const name=$('#aName').value.trim();
  if(!name||db.staff.some(s=>s.name===name)){alert('이름이 비어있거나 이미 존재합니다.');e.preventDefault();return}
  db.staff.push({name,nat:$('#aNat').value.trim(),grp:$('#aGrp').value.trim(),memo:''});
  save();markStaff();e.target.reset();renderStaff();renderCal();renderPanel();
});

/* ---------- 공통 ---------- */
function renderAll(){
  $('#monthbar').classList.toggle('hidden',tab==='staff');
  for(const t of ['cal','month','pay','staff'])$('#tab-'+t).classList.toggle('hidden',t!==tab);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(tab==='cal'){renderCal();renderPanel()}
  if(tab==='month')renderMonth();
  if(tab==='pay')renderPay();
  if(tab==='staff')renderStaff();
  $('#mtitle').textContent=`${view.y}년 ${view.m+1}월`;
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderAll()});
const shift=k=>{const d=new Date(view.y,view.m+k,1);view={y:d.getFullYear(),m:d.getMonth()};renderAll()};
$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);
$('#goToday').onclick=()=>{view={y:now.getFullYear(),m:now.getMonth()};sel=ds(now.getFullYear(),now.getMonth(),now.getDate());renderAll()};
$('#sstat').onclick=()=>{cfg.url?(sync.days.size||sync.staff||sync.all?flush():pullFromSheet()):(tab='staff',renderAll())};
setStatus(cfg.url?'busy':'off');
renderAll();
pullFromSheet();
</script>
</body>
</html>

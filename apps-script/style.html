<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;
  --full:#2563eb;--full-bg:#dbeafe;
  --half:#16a34a;--half-bg:#dcfce7;
  --part:#ea580c;--part-bg:#ffedd5;
  --accent:#111827;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1115;--card:#181b22;--ink:#e5e7eb;--mute:#9ca3af;--line:#2a2f3a;
  --full:#60a5fa;--full-bg:#1e3a8a55;--half:#4ade80;--half-bg:#14532d66;--part:#fb923c;--part-bg:#7c2d1266;--accent:#e5e7eb}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--bg)}
button.primary{background:var(--accent);color:var(--card);border-color:var(--accent)}
nav button.on{background:var(--accent);color:var(--card);border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:16px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar h2{margin:0;font-size:17px;min-width:120px;text-align:center}
.legend{display:flex;gap:12px;margin-left:auto;font-size:12px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);overflow:hidden}
.dow{padding:6px;text-align:center;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line)}
.dow:first-child,.day.sun .num{color:#dc2626}
.dow:nth-child(7),.day.sat .num{color:#2563eb}
.day{min-height:104px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.day:nth-child(7n){border-right:0}
.day:hover{background:var(--bg)}
.day.other{opacity:.35}
.day.today .num{background:var(--accent);color:var(--card);border-radius:10px;padding:0 6px}
.day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.num{font-size:12px;align-self:flex-start;margin-bottom:2px}
.chip{font-size:11px;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid}
.chip.full{background:var(--full-bg);border-color:var(--full);color:var(--full)}
.chip.half{background:var(--half-bg);border-color:var(--half);color:var(--half)}
.chip.part{background:var(--part-bg);border-color:var(--part);color:var(--part)}
.chip .memo{opacity:.8}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:3px}
.dot.full{background:var(--full)}.dot.half{background:var(--half)}.dot.part{background:var(--part)}
.panel{margin-top:16px;padding:14px}
.panel h3{margin:0 0 4px;font-size:16px}
.group{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);flex-wrap:wrap}
.ghead b{margin-right:auto}
.ghead select{padding:4px}
.row{display:grid;grid-template-columns:24px 110px 110px 80px 1fr;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--line)}
.row .nm small{color:var(--mute)}
.row input[type=text],.row input[type=number],.row select{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.row input:disabled,.row select:disabled{opacity:.4}
@media(max-width:640px){
  .row{grid-template-columns:24px 1fr 1fr;}
  .row .memo,.row .hrs{grid-column:2 / 4}
  .day{min-height:70px}.chip{font-size:10px;padding:0 3px}
  .legend{margin-left:0}
}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{font-size:12px;color:var(--mute);font-weight:600}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card h3{margin:0;padding:12px 14px;font-size:15px;border-bottom:1px solid var(--line)}
.card h3 small{color:var(--mute);font-weight:400;margin-left:6px}
.scroll{overflow-x:auto}
.hint{color:var(--mute);font-size:12px;margin:6px 2px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:420px;width:92%}
dialog label{display:block;margin:8px 0 2px;font-size:12px;color:var(--mute)}
dialog input,dialog select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.hidden{display:none}
.stat{font-size:12px;padding:2px 8px;border-radius:12px;margin-left:8px;vertical-align:2px;color:var(--mute)}
.stat.ok{color:var(--half)}.stat.err{color:#dc2626;border-color:#dc2626}.stat.busy{color:var(--part)}
.cfg label{display:block;margin:8px 0 2px;font-size:12px;color:var(--mute)}
.cfg input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
details{margin-top:10px}details ol{padding-left:20px;margin:6px 0}code{background:var(--bg);padding:1px 4px;border-radius:4px}
</style>
<style>#END-OF-style{display:none}</style>

<script>
/* ===== 1. 유틸 · 상태 · 저장소 ===== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const ymk=(y,m)=>`${y}-${pad(m+1)}`;
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return{y:a,m:b-1,d:c}};
const dow=s=>{const p=parse(s);return new Date(p.y,p.m,p.d).getDay()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won=n=>(Math.round(n)||0).toLocaleString('ko-KR');
const num=n=>Number.isInteger(n)?n:n.toFixed(1);
const DOW=['일','월','화','수','목','금','토'];
const TYPES={full:'전일',half:'반일',part:'시간'};
const SHORT={full:'전',half:'반',part:'시'};
const NOW=new Date();
const TODAY=ymd(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const DEFAULT_STAFF=[['조','태국','상근'],['짙','태국','상근'],['파이','태국','상근'],['짱','베트남','계절'],['유이','베트남','계절'],['푄','태국','예비'],['놈','태국','예비']]
  .map(([name,nat,grp])=>({name,nat,grp,active:true}));
const DEFAULT_CFG={wageSeasonal:0,wageOther:0,partBase:8,offDays:[],order:['상근','계절','예비'],seasonGroup:'계절',seasonFrom:3,seasonTo:10};
const S={staff:DEFAULT_STAFF.map(p=>({...p})),cfg:{...DEFAULT_CFG},months:{},pays:{}};
const EMPTY_M={rec:{},note:{},off:{}};
const monR=ym=>S.months[ym]||EMPTY_M;
const monW=ym=>S.months[ym]||(S.months[ym]={rec:{},note:{},off:{}});
const payR=(ym,p)=>(S.pays[ym]||{})['p'+p]||{};
const payW=(ym,p,n)=>{const d=S.pays[ym]||(S.pays[ym]={});const g=d['p'+p]||(d['p'+p]={});return g[n]||(g[n]={})};

const getDoc=k=>k==='staff'?S.staff:k==='cfg'?S.cfg:k[0]==='m'?S.months[k.slice(2)]:S.pays[k.slice(2)];
function setDoc(k,v){
  if(k==='staff')S.staff=v;else if(k==='cfg')S.cfg={...DEFAULT_CFG,...v};
  else if(k[0]==='m')S.months[k.slice(2)]=v;else S.pays[k.slice(2)]=v;
}
const allKeys=()=>['staff','cfg',...Object.keys(S.months).map(k=>'m:'+k),...Object.keys(S.pays).map(k=>'p:'+k)];

/* 저장: 변경된 문서만 모아 1초 뒤 한 번에 전송 (낙관적 UI — 화면은 즉시 반영) */
const HOSTED=typeof google!=='undefined'&&!!google.script&&!!google.script.run;
const gs=(fn,...a)=>new Promise((ok,ng)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>ng(new Error(e&&e.message||e)))[fn](...a));
const LS='hr2-cache';
const dirty=new Set();let flushing=false,tFlush,tCache;
function setSync(st,msg=''){
  const b=$('#sync');if(!b)return;
  b.textContent={local:'이 기기에만 저장',busy:'저장 중…',ok:'✔ 저장됨',err:'⚠ 저장 실패 · 클릭해 재시도',load:'불러오는 중…'}[st];
  b.className='sync '+(st==='ok'?'ok':st==='err'?'err':st==='busy'||st==='load'?'busy':'');b.title=msg;
}
function cacheNow(){try{const docs={};allKeys().forEach(k=>docs[k]=JSON.stringify(getDoc(k)));localStorage.setItem(LS,JSON.stringify({docs,dirty:[...dirty]}))}catch(e){}}
function touch(k){
  dirty.add(k);clearTimeout(tCache);tCache=setTimeout(cacheNow,300);
  if(!HOSTED){setSync('local');return}
  setSync('busy');clearTimeout(tFlush);tFlush=setTimeout(flush,1000);
}
async function flush(){
  clearTimeout(tFlush);
  if(!HOSTED||flushing||!dirty.size)return;
  flushing=true;const keys=[...dirty];dirty.clear();
  const ch={};keys.forEach(k=>ch[k]=JSON.stringify(getDoc(k)));
  try{await gs('apiSave',ch);cacheNow();flushing=false;if(dirty.size)flush();else setSync('ok')}
  catch(e){keys.forEach(k=>dirty.add(k));flushing=false;setSync('err',e.message);tFlush=setTimeout(flush,10000)}
}
function loadLocal(){
  try{
    const c=JSON.parse(localStorage.getItem(LS)||'null');if(!c)return;
    for(const[k,v]of Object.entries(c.docs))setDoc(k,JSON.parse(v));
    (c.dirty||[]).forEach(k=>dirty.add(k));
  }catch(e){}
}
async function pull(){
  if(!HOSTED){setSync('local');return false}
  setSync('load');
  try{
    const r=await gs('apiLoad');
    for(const[k,v]of Object.entries(r.docs)){if(dirty.has(k))continue;try{setDoc(k,JSON.parse(v))}catch(e){}}
    if(!r.docs.staff){touch('staff');touch('cfg')}
    if(dirty.size)flush();else setSync('ok');
    cacheNow();return true;
  }catch(e){setSync('err',e.message);return false}
}
</script>
<script>'END-OF-app1';</script>

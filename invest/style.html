<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,"Malgun Gothic",sans-serif;color:#1f2937;background:#f3f4f6}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:5}
h1{font-size:17px;margin:0}nav button,#refresh{border:1px solid #d1d5db;background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
nav button.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}#stamp{margin-left:auto;color:#6b7280;font-size:12px}
main{padding:14px;max-width:1280px;margin:0 auto}#loading{padding:30px;text-align:center;color:#6b7280}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card h2{font-size:15px;margin:0 0 10px}.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kpi{flex:1;min-width:150px;background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}.kpi b{display:block;font-size:19px}.kpi span{color:#6b7280;font-size:12px}
table{border-collapse:collapse;width:100%}th,td{padding:7px 8px;border-bottom:1px solid #eef0f3;text-align:left;white-space:nowrap}th{background:#f9fafb;font-weight:600;font-size:12px;color:#4b5563}
td.n,th.n{text-align:right}tfoot td{font-weight:700;background:#f9fafb}.scroll{overflow-x:auto}
tr.click{cursor:pointer}tr.click:hover{background:#eff6ff}tr.over td{background:#fef2f2}
.b{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;margin-right:3px}
.s{background:#fef3c7;color:#92400e}.l{background:#dbeafe;color:#1e40af}.t-p{background:#fee2e2;color:#991b1b}.t-i{background:#dcfce7;color:#166534}.t-x{background:#ede9fe;color:#5b21b6}.gray{background:#e5e7eb;color:#4b5563}.cond{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar select,.bar input{padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;font:inherit}
.calh{display:flex;align-items:center;gap:10px;margin-bottom:8px}.calh button{border:1px solid #d1d5db;background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}.calh b{font-size:16px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#e5e7eb;border:1px solid #e5e7eb}.cg>div{background:#fff;min-height:84px;padding:3px;overflow:hidden}
.cg .dow{min-height:0;text-align:center;font-weight:600;background:#f9fafb;padding:4px}.cg .d{font-size:12px;color:#6b7280}.cg .sel{outline:2px solid #1d4ed8;outline-offset:-2px}.cg .today .d{color:#1d4ed8;font-weight:700}.cg .oth{background:#fafafa;opacity:.5}
.chip{display:block;font-size:11px;margin-top:2px;padding:1px 3px;border-radius:4px;background:#f3f4f6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.chip.done{opacity:.5;text-decoration:line-through}
.more{font-size:11px;color:#1d4ed8}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;overflow:auto;padding:20px}.box{background:#fff;max-width:900px;margin:0 auto;border-radius:12px;padding:20px;position:relative}
#mclose{position:absolute;right:12px;top:10px;border:0;background:none;font-size:20px;cursor:pointer}
.kv{display:grid;grid-template-columns:130px 1fr;gap:0;border:1px solid #eef0f3;border-radius:8px;overflow:hidden;margin-bottom:14px}.kv>div{padding:6px 10px;border-bottom:1px solid #eef0f3;white-space:pre-wrap;word-break:break-all}.kv>div:nth-child(odd){background:#f9fafb;color:#4b5563;font-weight:600}
h3{font-size:14px;margin:14px 0 6px}a{color:#1d4ed8}.muted{color:#9ca3af}.note{padding:8px 10px;border-radius:8px;background:#fff7ed;margin-bottom:6px}
</style><div id="END-OF-style" hidden></div>

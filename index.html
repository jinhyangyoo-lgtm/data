<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인력관리</title>
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#1a1f2c;--mute:#667085;--line:#e3e6ec;--soft:#f1f3f7;--brand:#3454d1;
--full:#2563eb;--full-bg:#e0eaff;--half:#15a34a;--half-bg:#dcf5e5;--part:#e26d00;--part-bg:#ffecd6;
--off:#d92d20;--off-bg:#fdeceb;--pay:#a16207;--pay-bg:#fff1bf;--ok:#15803d;--ok-bg:#e3f7ea;--r:12px}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b23;--ink:#e6e9f0;--mute:#98a2b3;--line:#2a303c;--soft:#1f2430;--brand:#6f88ff;
--full:#7aa7ff;--full-bg:#1b2c55;--half:#4ade80;--half-bg:#12361f;--part:#fb923c;--part-bg:#47260b;
--off:#f87171;--off-bg:#3a1717;--pay:#facc15;--pay-bg:#3d3410;--ok:#4ade80;--ok-bg:#12361f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--soft)}
button.pri{background:var(--brand);border-color:var(--brand);color:#fff}
button.pri:hover{filter:brightness(1.1)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
input:disabled{opacity:.5}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center}
.sync{font-size:12px;font-weight:400;color:var(--mute);margin-left:10px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:none}
.sheetlink{font-size:12px;margin-left:8px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--brand);text-decoration:none;font-weight:600}.sheetlink:hover{background:var(--soft)}
.sync.ok{color:var(--ok)}.sync.err{color:var(--off);border-color:var(--off)}.sync.busy{color:var(--part)}
nav{display:flex;gap:4px;margin-left:auto}
nav button{border:0;background:none;padding:8px 14px;font-weight:600;color:var(--mute)}
nav button.on{background:var(--brand);color:#fff}
main{max-width:1320px;margin:0 auto;padding:14px 16px 48px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar h2{margin:0;font-size:20px;min-width:150px;text-align:center}
.legend{margin-left:auto;display:flex;gap:12px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.sw.full{background:var(--full)}.sw.half{background:var(--half)}.sw.part{background:var(--part)}.sw.off{background:var(--off)}.sw.pay{background:#eab308}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.k{text-align:left;padding:10px 14px;border-radius:var(--r);background:var(--card)}
.k small{color:var(--mute);display:block}.k b{font-size:19px}
.k em{font-style:normal;font-size:12px;font-weight:600;margin-left:6px;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--mute)}
.k em.ok{background:var(--ok-bg);color:var(--ok)}.k em.wait{background:var(--pay-bg);color:var(--pay)}
.calwrap{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(340px,1fr);gap:14px;align-items:start}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));overflow:hidden;border-radius:var(--r)}
.dw{padding:6px;text-align:center;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);background:var(--soft)}
.dw:first-child{color:var(--off)}.dw:nth-child(7){color:var(--full)}
.day{min-height:112px;padding:4px 5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.day:nth-child(7n){border-right:0}
.day:hover{background:var(--soft)}
.day.other{opacity:.4}
.day.off{background:var(--off-bg)}
.day.sel{outline:2px solid var(--brand);outline-offset:-2px;z-index:1}
.dh{display:flex;align-items:center;gap:4px;min-height:20px}
.num{font-size:12px;font-weight:600}
.sun .num{color:var(--off)}.sat .num{color:var(--full)}
.today .num{background:var(--brand);color:#fff!important;border-radius:99px;padding:0 7px}
.tag{font-size:10px;font-weight:700;padding:0 6px;border-radius:4px;line-height:17px}
.tag.off{background:var(--off);color:#fff}
.cnt{display:flex;gap:3px;flex-wrap:wrap}
.cnt i{font-style:normal;font-size:10.5px;font-weight:700;padding:0 5px;border-radius:4px}
.cnt .full,.chip.full{background:var(--full-bg);color:var(--full)}
.cnt .half,.chip.half{background:var(--half-bg);color:var(--half)}
.cnt .part,.chip.part{background:var(--part-bg);color:var(--part)}
.chips{display:flex;flex-direction:column;gap:2px;min-width:0}
.chip{font-size:11px;padding:0 5px;border-radius:4px;border-left:3px solid currentColor;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.more{border:0;color:var(--mute);background:none}
.dn{font-size:11px;line-height:1.35;color:var(--ink);background:var(--pay-bg);border-radius:4px;padding:1px 5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.pm{font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk{display:none;font-size:11px;margin-left:auto}
.paytag{margin-top:auto;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--pay-bg);color:var(--pay);border:1px solid #eab308}
.paytag.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.paytag small{display:block;font-weight:500}.paytag .ps{display:none}
.day.payday{box-shadow:inset 0 3px 0 #eab308}
@media(max-width:1000px){.calwrap{grid-template-columns:1fr}.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.mk{display:inline}.dn,.pm{display:none}.paytag small,.paytag .pf{display:none}.paytag .ps{display:inline}.paytag{padding:1px 3px;font-size:10px}.chips{display:none}.day{min-height:78px}.legend{margin-left:0}nav{margin-left:0;width:100%;overflow-x:auto}.brand{width:100%}}
</style>
<style>
.side{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;padding:12px}
.phead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phead>div{flex:1;min-width:120px}.phead b{font-size:16px}.phead small{color:var(--mute);margin-left:8px}
.phead .pm{padding:2px 10px}
.offbtn.on{background:var(--off);border-color:var(--off);color:#fff}
.ptools{display:flex;gap:6px;margin:10px 0 6px;flex-wrap:wrap}
#dnote{width:100%;resize:vertical;min-height:34px;margin-bottom:6px}
.grp{border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}
.gh{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--soft);flex-wrap:wrap}
.gh b{margin-right:2px}.gh .gc{color:var(--mute);font-size:12px;margin-right:auto}
.gh button,.gh select{padding:3px 8px;font-size:12px}
.grp.closed .gh{opacity:.6}
.prow{display:grid;grid-template-columns:76px 1fr 58px 30px;gap:6px;align-items:center;padding:6px 8px;border-top:1px solid var(--line)}
.prow.on{background:linear-gradient(90deg,var(--soft),transparent)}
.pn b{display:block;line-height:1.2}.pn small{color:var(--mute);font-size:11px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;padding:5px 2px;font-size:13px;background:var(--card);color:var(--mute)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on[data-t=full]{background:var(--full);color:#fff}
.seg button.on[data-t=half]{background:var(--half);color:#fff}
.seg button.on[data-t=part]{background:var(--part);color:#fff}
.prow .hrs{width:58px;padding:5px}.prow .x{padding:3px 0;color:var(--mute)}
.prow .memo{grid-column:1/-1}
.prow .hide{visibility:hidden}.prow .memo.hide{display:none}
.hint{color:var(--mute);font-size:12px;margin:6px 2px}
.warnbox{background:var(--pay-bg);color:var(--pay);border:1px solid #eab308;border-radius:var(--r);padding:8px 12px;margin-bottom:12px}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg2 button{border:0;border-radius:0;padding:6px 14px;background:none;color:var(--mute);font-weight:600}
.seg2 button.on{background:var(--brand);color:#fff}
.sum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:12px 0}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.sum small{display:block;color:var(--mute)}.sum b{font-size:17px}
.sum .okc b{color:var(--ok)}.sum .wc b{color:var(--pay)}
.bulk{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}.bulk .sp{margin-left:auto;color:var(--mute)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:600;background:var(--soft)}
td.l,th.l{text-align:left}
td small{color:var(--mute);margin-left:6px}
tr.gr td{background:var(--soft);font-weight:700;text-align:left}
tr.gr td.r{text-align:right}
tr.paid{background:var(--ok-bg)}tr.zero td{color:var(--mute)}
.amt{width:96px;text-align:right}.pd{width:136px;padding:3px 6px}
.ok{color:var(--ok);font-weight:600}.warn{color:var(--pay);margin:0 4px}
tfoot td{font-weight:700;border-top:2px solid var(--line);background:var(--soft)}
.ytbl td,.ytbl th{padding:6px 7px;font-size:13px}
.ytbl .c1{position:sticky;left:0;background:var(--card);z-index:1}
.ytbl tr.gr .c1{background:var(--soft)}
.ytbl td.cur,.ytbl th.cur{background:var(--pay-bg)}
.ytbl .tt{font-weight:700;border-left:2px solid var(--line)}
.yc b{display:block;font-size:14px}.yc small{display:block;margin:0;color:var(--mute);font-size:11px}
.na{color:var(--mute);opacity:.45;font-size:11px;font-weight:400}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start}
.set .card{padding:14px}.set h3{margin:0 0 8px;font-size:15px}
.f{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;margin:6px 0}
.f label{color:var(--mute)}
.days{display:flex;gap:4px;flex-wrap:wrap}.days label{display:flex;gap:3px;align-items:center;color:var(--ink);padding:3px 8px;border:1px solid var(--line);border-radius:8px}
.gl{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--line)}.gl span{flex:1}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);width:min(92vw,400px)}
dialog label{display:block;margin:8px 0 2px;font-size:12px;color:var(--mute)}dialog input{width:100%}
@media(max-width:900px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">인력관리<button class="sync" id="sync"></button><a id="sheetlink" class="sheetlink" target="_blank" rel="noopener" hidden>📄 구글 시트 열기</a></div>
  <nav id="nav">
    <button data-tab="cal" class="on">캘린더</button><button data-tab="pay">급여 지급</button>
    <button data-tab="year">연간 현황</button><button data-tab="set">설정</button>
  </nav>
</header>
<main>
  <div class="bar" id="bar">
    <button id="prev">◀</button><h2 id="title"></h2><button id="next">▶</button><button id="today">오늘</button>
    <div class="legend" id="legend">
      <span><i class="sw full"></i>전일</span><span><i class="sw half"></i>반일</span><span><i class="sw part"></i>시간제</span>
      <span><i class="sw off"></i>휴무일</span><span><i class="sw pay"></i>급여일</span>
    </div>
  </div>
  <section id="v-cal">
    <div class="kpi" id="kpi"></div>
    <div class="calwrap"><div class="card"><div class="cal" id="cal"></div></div><aside class="card side" id="panel"></aside></div>
  </section>
  <section id="v-pay" hidden></section>
  <section id="v-year" hidden></section>
  <section id="v-set" hidden></section>
</main>
<dialog id="dlg"><form method="dialog" id="addForm">
  <h3 style="margin:0">직원 추가</h3>
  <label>이름</label><input id="aName" required>
  <label>국적</label><input id="aNat">
  <label>구분 (그룹)</label><input id="aGrp" list="grpList" required><datalist id="grpList"></datalist>
  <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button value="cancel" formnovalidate>취소</button><button class="pri" value="ok">추가</button></div>
</form></dialog>

<script>
/* ===== 1. 유틸 · 상태 · 저장소 ===== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const ymk=(y,m)=>`${y}-${pad(m+1)}`;
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return{y:a,m:b-1,d:c}};
const dow=s=>{const p=parse(s);return new Date(p.y,p.m,p.d).getDay()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won=n=>(Math.round(n)||0).toLocaleString('ko-KR');
const num=n=>Number.isInteger(n)?n:n.toFixed(1);
const DOW=['일','월','화','수','목','금','토'];
const TYPES={full:'전일',half:'반일',part:'시간'};
const SHORT={full:'전',half:'반',part:'시'};
const NOW=new Date();
const TODAY=ymd(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const DEFAULT_STAFF=[['조','태국','상근'],['짙','태국','상근'],['파이','태국','상근'],['짱','베트남','계절'],['유이','베트남','계절'],['푄','태국','예비'],['놈','태국','예비']]
  .map(([name,nat,grp])=>({name,nat,grp,active:true}));
const DEFAULT_CFG={wageSeasonal:92880,wageOther:100000,partBase:8,offDays:[],order:['상근','계절','예비'],seasonGroup:'계절',seasonOn:true};
const S={staff:DEFAULT_STAFF.map(p=>({...p})),cfg:{...DEFAULT_CFG},months:{},pays:{}};
const EMPTY_M={rec:{},note:{},off:{}};
const monR=ym=>S.months[ym]||EMPTY_M;
const monW=ym=>S.months[ym]||(S.months[ym]={rec:{},note:{},off:{}});
const payR=(ym,p)=>(S.pays[ym]||{})['p'+p]||{};
const payW=(ym,p,n)=>{const d=S.pays[ym]||(S.pays[ym]={});const g=d['p'+p]||(d['p'+p]={});return g[n]||(g[n]={})};

const getDoc=k=>k==='staff'?S.staff:k==='cfg'?S.cfg:k[0]==='m'?S.months[k.slice(2)]:S.pays[k.slice(2)];
function setDoc(k,v){
  if(k==='staff')S.staff=v;else if(k==='cfg')S.cfg={...DEFAULT_CFG,...v};
  else if(k[0]==='m')S.months[k.slice(2)]=v;else S.pays[k.slice(2)]=v;
}
const allKeys=()=>['staff','cfg',...Object.keys(S.months).map(k=>'m:'+k),...Object.keys(S.pays).map(k=>'p:'+k)];

/* 저장: 변경된 문서만 모아 1초 뒤 한 번에 전송 (낙관적 UI — 화면은 즉시 반영) */
const HOSTED=typeof google!=='undefined'&&!!google.script&&!!google.script.run;
const gs=(fn,...a)=>new Promise((ok,ng)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>ng(new Error(e&&e.message||e)))[fn](...a));
const LS='hr2-cache';
const dirty=new Set();let flushing=false,tFlush,tCache;
function setSync(st,msg=''){
  const b=$('#sync');if(!b)return;
  b.textContent={local:'이 기기에만 저장',busy:'저장 중…',ok:'✔ 저장됨',err:'⚠ 저장 실패 · 클릭해 재시도',load:'불러오는 중…'}[st];
  b.className='sync '+(st==='ok'?'ok':st==='err'?'err':st==='busy'||st==='load'?'busy':'');b.title=msg;
}
function cacheNow(){try{const docs={};allKeys().forEach(k=>docs[k]=JSON.stringify(getDoc(k)));localStorage.setItem(LS,JSON.stringify({docs,dirty:[...dirty]}))}catch(e){}}
function touch(k){
  dirty.add(k);clearTimeout(tCache);tCache=setTimeout(cacheNow,300);
  if(!HOSTED){setSync('local');return}
  setSync('busy');clearTimeout(tFlush);tFlush=setTimeout(flush,1000);
}
async function flush(){
  clearTimeout(tFlush);
  if(!HOSTED||flushing||!dirty.size)return;
  flushing=true;const keys=[...dirty];dirty.clear();
  const ch={};keys.forEach(k=>ch[k]=JSON.stringify(getDoc(k)));
  try{await gs('apiSave',ch);cacheNow();flushing=false;if(dirty.size)flush();else setSync('ok')}
  catch(e){keys.forEach(k=>dirty.add(k));flushing=false;setSync('err',e.message);tFlush=setTimeout(flush,10000)}
}
function loadLocal(){
  try{
    const c=JSON.parse(localStorage.getItem(LS)||'null');if(!c)return;
    for(const[k,v]of Object.entries(c.docs))setDoc(k,JSON.parse(v));
    (c.dirty||[]).forEach(k=>dirty.add(k));
  }catch(e){}
}
async function pull(){
  if(!HOSTED){setSync('local');return false}
  setSync('load');
  try{
    const r=await gs('apiLoad');
    if(r.url){const a=$('#sheetlink');a.href=r.url;a.hidden=false}
    for(const[k,v]of Object.entries(r.docs)){if(dirty.has(k))continue;try{setDoc(k,JSON.parse(v))}catch(e){}}
    if(!r.docs.staff){touch('staff');touch('cfg')}
    if(dirty.size)flush();else setSync('ok');
    cacheNow();return true;
  }catch(e){setSync('err',e.message);return false}
}
</script>
<script>
/* ===== 2. 계산 로직 ===== */
function groups(){
  const o=S.cfg.order.slice();
  S.staff.forEach(p=>{if(!o.includes(p.grp))o.push(p.grp)});
  return o.filter(g=>S.staff.some(p=>p.grp===g));
}
const groupOpen=g=>g!==S.cfg.seasonGroup||S.cfg.seasonOn!==false;   // 계절근로는 설정의 '활성화' 체크로 켜고 끈다
function isOff(ds){
  const mo=monR(ds.slice(0,7));
  return ds in mo.off?mo.off[ds]:S.cfg.offDays.includes(dow(ds));
}
const wageOf=p=>p.wage>0?+p.wage:p.grp===S.cfg.seasonGroup?+S.cfg.wageSeasonal||0:+S.cfg.wageOther||0;
/* per: 1 = 1~15일분(15일 지급), 2 = 16일~말일분(말일 지급) */
function calc(ym,per){
  const y=+ym.slice(0,4),m=+ym.slice(5,7)-1,last=dim(y,m),from=per===1?1:16,to=per===1?15:last;
  const mo=monR(ym),pays=payR(ym,per),rows=[];
  for(const p of S.staff){
    const r={p,full:0,half:0,part:0,hours:0};
    for(let d=from;d<=to;d++){
      const x=(mo.rec[ymd(y,m,d)]||{})[p.name];
      if(x){r[x.t]++;if(x.t==='part')r.hours+=Number(x.h)||0}
    }
    r.days=r.full+r.half*.5;r.wage=wageOf(p);
    r.base=Math.round(r.wage*r.days+r.wage/(+S.cfg.partBase||8)*r.hours);
    const pr=pays[p.name]||{};
    r.allow=Number(pr.allow)||0;r.alba=Number(pr.alba)||0;r.paid=!!pr.paid;r.paidAt=pr.paidAt||'';
    if(r.paid&&pr.fixed!=null)r.base=pr.fixed-r.allow-r.alba;   // 이전 시스템에서 가져온 지급액은 그대로 유지
    r.changed=r.paid&&pr.fixed==null&&pr.amt!=null&&pr.amt!==r.base;
    r.total=r.base+r.allow+r.alba;
    const act=r.days>0||r.hours>0||r.allow||r.alba||r.paid;
    if(act||(p.active!==false&&groupOpen(p.grp,ym)))rows.push(r);
  }
  return{rows,t:totals(rows),from,to,last,ym,per,payDay:to};
}
function totals(rows){
  const t={base:0,allow:0,alba:0,total:0,paid:0,unpaid:0,n:0,pn:0,days:0};
  rows.forEach(r=>{
    t.base+=r.base;t.allow+=r.allow;t.alba+=r.alba;t.total+=r.total;t.days+=r.days;
    if(r.total>0){t.n++;if(r.paid){t.paid+=r.total;t.pn++}else t.unpaid+=r.total}
  });
  return t;
}
const worklabel=r=>[r.full&&`전일 ${r.full}`,r.half&&`반일 ${r.half}`,r.part&&`시간 ${r.part}일(${num(r.hours)}h)`].filter(Boolean).join(' · ')||'–';
const orderedStaff=()=>{const g=groups();return S.staff.slice().sort((a,b)=>g.indexOf(a.grp)-g.indexOf(b.grp))};
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
</script>
<script>
/* ===== 3. 캘린더 ===== */
let view={y:NOW.getFullYear(),m:NOW.getMonth()},sel=TODAY,tab='cal';
const short=n=>n>=10000?(Math.round(n/1000)/10)+'만':won(n);
function renderKpi(P1,P2){
  const ym=P1.ym,stat=t=>!t.n?'<em>대상 없음</em>':t.pn===t.n?'<em class="ok">지급완료</em>':`<em class="wait">미지급 ${t.n-t.pn}명</em>`;
  const tot={total:P1.t.total+P2.t.total,paid:P1.t.paid+P2.t.paid,unpaid:P1.t.unpaid+P2.t.unpaid,days:P1.t.days+P2.t.days};
  const head=(P)=>`<small>${view.m+1}/${P.payDay} 지급분 (${P.from}~${P.to}일)</small><b>₩${won(P.t.total)}</b>${stat(P.t)}`;
  $('#kpi').innerHTML=`<button class="k card" data-go="1">${head(P1)}</button><button class="k card" data-go="2">${head(P2)}</button>
   <button class="k card" data-go="1"><small>이번 달 총 지급액</small><b>₩${won(tot.total)}</b><em class="ok">완료 ${won(tot.paid)}</em><em class="wait">미지급 ${won(tot.unpaid)}</em></button>
   <div class="k card" style="cursor:default"><small>이번 달 환산 근무일 합계</small><b>${num(tot.days)}일</b></div>`;
}
function renderCal(){
  const{y,m}=view,ym=ymk(y,m),P1=calc(ym,1),P2=calc(ym,2),n=dim(y,m);
  $('#title').textContent=`${y}년 ${m+1}월`;
  renderKpi(P1,P2);
  const first=new Date(y,m,1).getDay(),total=Math.ceil((first+n)/7)*7;
  let h=DOW.map(d=>`<div class="dw">${d}</div>`).join('');
  for(let i=0;i<total;i++){
    const d=new Date(y,m,1-first+i),ds=ymd(d.getFullYear(),d.getMonth(),d.getDate()),other=d.getMonth()!==m;
    const rec=monR(ds.slice(0,7)).rec[ds]||{},who=S.staff.filter(p=>rec[p.name]),w=d.getDay();
    const c={full:0,half:0,part:0};who.forEach(p=>c[rec[p.name].t]++);
    const pd=!other&&(d.getDate()===15?P1:d.getDate()===n?P2:null);
    const chips=who.slice(0,7).map(p=>{const x=rec[p.name];
      return`<div class="chip ${x.t}" title="${esc(p.name)} ${TYPES[x.t]}${x.m?' · '+esc(x.m):''}">${esc(p.name)}${x.t==='half'?' 반':x.t==='part'?' '+(x.h?x.h+'h':'시'):''}</div>`}).join('')+(who.length>7?`<div class="chip more">+${who.length-7}명</div>`:'');
    const off=isOff(ds),note=monR(ds.slice(0,7)).note[ds]||'',memos=who.filter(p=>rec[p.name].m);
    h+=`<div class="day ${other?'other':''} ${ds===TODAY?'today':''} ${ds===sel?'sel':''} ${off?'off':''} ${pd?'payday':''} ${w===0?'sun':w===6?'sat':''}" data-d="${ds}">
     <div class="dh"><span class="num">${d.getDate()}</span>${off?'<span class="tag off">휴무</span>':''}${note||memos.length?'<span class="mk" title="메모 있음">📝</span>':''}</div>
     <div class="cnt">${['full','half','part'].map(t=>c[t]?`<i class="${t}">${SHORT[t]} ${c[t]}</i>`:'').join('')}</div>
     <div class="chips">${chips}</div>
     ${note?`<div class="dn" title="${esc(note)}">${esc(note)}</div>`:''}
     ${memos.slice(0,2).map(p=>`<div class="pm" title="${esc(p.name)}: ${esc(rec[p.name].m)}">${esc(p.name)}: ${esc(rec[p.name].m)}</div>`).join('')}${memos.length>2?`<div class="pm">외 메모 ${memos.length-2}건</div>`:''}
     ${pd?`<div class="paytag ${pd.t.n&&pd.t.pn===pd.t.n?'done':''}">💰 <span class="pf">급여일 ₩${won(pd.t.total)}</span><span class="ps">${short(pd.t.total)}</span><small>${!pd.t.n?'지급 대상 없음':pd.t.pn===pd.t.n?'✔ 지급완료':`미지급 ${pd.t.n-pd.t.pn}/${pd.t.n}명`}</small></div>`:''}
    </div>`;
  }
  $('#cal').innerHTML=h;
}
$('#cal').addEventListener('click',e=>{
  const c=e.target.closest('.day');if(!c)return;
  sel=c.dataset.d;const p=parse(sel);
  if(p.y!==view.y||p.m!==view.m)view={y:p.y,m:p.m};

});
$('#kpi').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){pv.per=+b.dataset.go;setTab('pay')}});
</script>
<script>
/* ===== 4. 일별 근무 입력 패널 ===== */
const bulk={};
const curYm=()=>sel.slice(0,7);
const curRec=()=>monR(curYm()).rec[sel]||{};
function setRec(name,t){
  const mo=monW(curYm()),rec=mo.rec[sel]||(mo.rec[sel]={}),old=rec[name];
  if(t)rec[name]={t,h:t==='part'&&old?old.h||'':'',m:old?old.m||'':''};else delete rec[name];
  if(!Object.keys(rec).length)delete mo.rec[sel];
  touch('m:'+curYm());
}
function rowHTML(p,x){
  return`<div class="prow ${x?'on':''}" data-n="${esc(p.name)}"><div class="pn"><b>${esc(p.name)}</b><small>${esc(p.nat||'')}</small></div>
  <div class="seg">${['full','half','part'].map(t=>`<button data-t="${t}" class="${x&&x.t===t?'on':''}">${TYPES[t]}</button>`).join('')}</div>
  <input class="hrs ${x&&x.t==='part'?'':'hide'}" data-f="h" type="number" min="0" max="24" step="0.5" placeholder="시간" value="${x&&x.h||''}">

}
function renderPanel(){
  const p=parse(sel),ym=curYm(),rec=curRec(),off=isOff(sel),note=monR(ym).note[sel]||'',gl=groups();
  let h=`<div class="phead"><button class="pm" data-pd="-1">‹</button><div><b>${p.m+1}월 ${p.d}일 (${DOW[dow(sel)]})</b><small>출근 ${Object.keys(rec).length}명</small></div><button class="pm" data-pd="1">›</button>
   <button class="offbtn ${off?'on':''}" data-off>${off?'휴무일 해제':'휴무일로 지정'}</button></div>
   <div class="ptools"><button data-copy>어제와 동일하게</button><button data-clear>전체 해제</button></div>
   <textarea id="dnote" rows="1" placeholder="이 날의 공통 메모">${esc(note)}</textarea>`;
  gl.forEach((g,i)=>{
    const open=groupOpen(g,ym),mem=S.staff.filter(x=>x.grp===g&&(x.active!==false||rec[x.name])),show=open||mem.some(x=>rec[x.name]);
    const bt=bulk[g]||'full',on=mem.filter(x=>rec[x.name]).length;
    h+=`<section class="grp ${open?'':'closed'}" data-g="${esc(g)}"><div class="gh"><b>${esc(g)}</b><span class="gc">${on}/${mem.length}명</span>
      ${show?`<select data-bt>${['full','half','part'].map(t=>`<option value="${t}" ${t===bt?'selected':''}>${TYPES[t]}</option>`).join('')}</select><button data-gall>전원 출근</button><button data-gnone>해제</button>`:''}
      <button data-gm="-1" ${i?'':'disabled'} title="위로">▲</button><button data-gm="1" ${i<gl.length-1?'':'disabled'} title="아래로">▼</button></div>
      ${show?mem.map(x=>rowHTML(x,rec[x.name])).join(''):`<div class="hint" style="padding:8px">${esc(g)} 근로가 비활성화되어 있습니다. 설정에서 '활성화'를 체크하면 입력할 수 있습니다.</div>`}</section>`;
  });
  $('#panel').innerHTML=h;
}
function moveGroup(g,d){
  const a=groups(),i=a.indexOf(g),j=i+d;if(j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];S.cfg.order=a;touch('cfg');renderPanel();if(tab==='set')renderSettings();
}
function setOff(){
  const mo=monW(curYm()),def=S.cfg.offDays.includes(dow(sel)),v=!isOff(sel);
  if(v===def)delete mo.off[sel];else mo.off[sel]=v;touch('m:'+curYm());
}
function copyPrev(){
  const p=parse(sel),d=new Date(p.y,p.m,p.d-1),ds=ymd(d.getFullYear(),d.getMonth(),d.getDate());
  const src=monR(ds.slice(0,7)).rec[ds]||{};
  if(!Object.keys(src).length){alert('전날 근무 기록이 없습니다.');return}
  const mo=monW(curYm());mo.rec[sel]={};
  S.staff.forEach(x=>{if(src[x.name]&&groupOpen(x.grp,curYm()))mo.rec[sel][x.name]={...src[x.name]}});
  if(!Object.keys(mo.rec[sel]).length)delete mo.rec[sel];touch('m:'+curYm());
}
function shiftSel(k){const p=parse(sel),d=new Date(p.y,p.m,p.d+k);sel=ymd(d.getFullYear(),d.getMonth(),d.getDate());view={y:d.getFullYear(),m:d.getMonth()}}
$('#panel').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const row=b.closest('.prow'),g=b.closest('.grp')?.dataset.g;
  if(row&&b.hasAttribute('data-t')){const t=b.dataset.t,cur=curRec()[row.dataset.n];setRec(row.dataset.n,!t||(cur&&cur.t===t)?null:t)}
  else if(b.dataset.pd)shiftSel(+b.dataset.pd);
  else if(b.hasAttribute('data-off'))setOff();
  else if(b.hasAttribute('data-copy'))copyPrev();
  else if(b.hasAttribute('data-clear')){const mo=monW(curYm());delete mo.rec[sel];touch('m:'+curYm())}
  else if(b.dataset.gm){moveGroup(g,+b.dataset.gm);return}
  else if(b.hasAttribute('data-gall')){const rec=curRec();S.staff.filter(x=>x.grp===g&&x.active!==false&&!rec[x.name]).forEach(x=>setRec(x.name,bulk[g]||'full'))}
  else if(b.hasAttribute('data-gnone')){S.staff.filter(x=>x.grp===g).forEach(x=>setRec(x.name,null))}
  else return;
  renderCal();renderPanel();
});
$('#panel').addEventListener('change',e=>{if(e.target.hasAttribute('data-bt'))bulk[e.target.closest('.grp').dataset.g]=e.target.value});
$('#panel').addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='dnote'){const mo=monW(curYm());if(t.value.trim())mo.note[sel]=t.value;else delete mo.note[sel];touch('m:'+curYm());renderCal();return}
  const row=t.closest('.prow'),f=t.dataset.f;if(!row||!f)return;
  const x=curRec()[row.dataset.n];if(!x)return;
  x[f]=t.value;touch('m:'+curYm());renderCal();
});
</script>
<script>
/* ===== 5. 급여 지급 ===== */
const pv={per:NOW.getDate()<=15?1:2,sel:new Set(),date:TODAY};
const parseAmt=v=>Number(String(v).replace(/[^0-9.-]/g,''))||0;
function payRow(r){
  const n=esc(r.p.name),dis=r.paid?'disabled':'';
  return`<tr class="${r.paid?'paid':''} ${r.total?'':'zero'}" data-n="${n}">
   <td><input type="checkbox" data-sel ${pv.sel.has(r.p.name)?'checked':''} ${r.paid||!r.total?'disabled':''}></td>
   <td class="l"><b>${n}</b><small>${esc(r.p.nat||'')}</small></td><td class="l">${worklabel(r)}</td>
   <td>${num(r.days)}일</td><td>${won(r.wage)}</td><td data-c="base">${won(r.base)}</td>
   <td><input class="amt" data-pf="allow" inputmode="numeric" value="${r.allow?won(r.allow):''}" placeholder="0" ${dis}></td>
   <td><input class="amt" data-pf="alba" inputmode="numeric" value="${r.alba?won(r.alba):''}" placeholder="0" ${dis}></td>
   <td data-c="total"><b>${won(r.total)}</b></td>
   <td class="l">${r.paid?`<span class="ok">✔</span> <input type="date" class="pd" data-pd value="${esc(r.paidAt)}" title="지급일 변경">${r.changed?'<span class="warn" title="지급 이후 근무기록이 변경되었습니다">⚠변경</span>':''} <button data-cancel>취소</button>`:`<button class="pri" data-pay ${r.total?'':'disabled'}>지급</button>`}</td></tr>`;
}
function sumHTML(t){
  return`<div><small>대상 / 지급완료</small><b>${t.n}명 / ${t.pn}명</b></div><div><small>급여 (근무분)</small><b>₩${won(t.base)}</b></div>
   <div><small>수당 + 알바비</small><b>₩${won(t.allow+t.alba)}</b></div><div class="okc"><small>지급완료</small><b>₩${won(t.paid)}</b></div><div class="wc"><small>미지급 (총 ${won(t.total)})</small><b>₩${won(t.unpaid)}</b></div>`;
}
function renderPay(){
  const ym=ymk(view.y,view.m),P=calc(ym,pv.per),gl=groups(),noWage=!(+S.cfg.wageSeasonal)&&!(+S.cfg.wageOther);
  $('#title').textContent=`${view.y}년 ${view.m+1}월`;
  let h=noWage?'<div class="warnbox">일당이 설정되지 않아 급여가 0원으로 계산됩니다. <b>설정 → 급여 기준</b>에서 일당을 입력하세요.</div>':'';
  h+=`<div class="seg2"><button data-per="1" class="${pv.per===1?'on':''}">${view.m+1}/15 지급 (1~15일)</button><button data-per="2" class="${pv.per===2?'on':''}">${view.m+1}/${P.last} 지급 (16~${P.last}일)</button></div>
   <div class="sum" id="psum">${sumHTML(P.t)}</div>
   <div class="bulk"><label>지급일 <input type="date" id="paydate" value="${pv.date}"></label><button class="pri" data-payall>미지급 전원 지급처리</button><button data-paysel>선택 지급처리</button><button data-cancelsel>선택 지급취소</button><span class="sp">일당: 계절 ${won(S.cfg.wageSeasonal)}원 · 그 외 ${won(S.cfg.wageOther)}원 · 시간제는 일당÷${S.cfg.partBase}시간</span></div>
   <div class="card tbl"><table><thead><tr><th><input type="checkbox" id="selall"></th><th class="l">이름</th><th class="l">근무내역</th><th>환산일</th><th>일당</th><th>급여</th><th>수당</th><th>알바비</th><th>합계</th><th class="l">지급</th></tr></thead><tbody>`;
  gl.forEach(g=>{
    const rs=P.rows.filter(r=>r.p.grp===g);if(!rs.length)return;
    h+=`<tr class="gr"><td colspan="8">${esc(g)} (${rs.length}명)</td><td class="r" colspan="2">₩${won(rs.reduce((a,r)=>a+r.total,0))}</td></tr>`+rs.map(payRow).join('');
  });
  $('#v-pay').innerHTML=h+`</tbody></table></div><div class="hint">수당·알바비는 급여와 별도로 입력하며 입력 즉시 합계에 반영됩니다. 지급처리 후에는 금액이 잠기고, 취소하면 다시 수정할 수 있습니다.</div>`;
}
function refreshPay(){
  const P=calc(ymk(view.y,view.m),pv.per);$('#psum').innerHTML=sumHTML(P.t);
  P.rows.forEach(r=>{const tr=document.querySelector(`#v-pay tr[data-n="${CSS.escape(r.p.name)}"]`);if(!tr)return;
    tr.querySelector('[data-c=total]').innerHTML=`<b>${won(r.total)}</b>`;tr.classList.toggle('zero',!r.total);
    const pb=tr.querySelector('[data-pay]');if(pb)pb.disabled=!r.total;const cb=tr.querySelector('[data-sel]');if(cb)cb.disabled=!r.total});
}
function doPay(names,paid){
  const ym=ymk(view.y,view.m),P=calc(ym,pv.per),rs=P.rows.filter(r=>names.includes(r.p.name)&&r.paid!==paid&&(!paid||r.total>0));
  if(!rs.length){alert(paid?'지급처리할 대상이 없습니다.':'취소할 대상이 없습니다.');return}
  if(paid&&!/^\d{4}-\d{2}-\d{2}$/.test(pv.date)){alert('지급일을 선택하세요.');return}
  const sum=rs.reduce((a,r)=>a+r.total,0);
  if(!confirm(`${rs.length}명 · ₩${won(sum)}\n${rs.map(r=>r.p.name).join(', ')}\n\n${paid?`지급일 ${pv.date}로 지급 처리할까요?`:'지급을 취소할까요?'}`))return;
  rs.forEach(r=>{const x=payW(ym,pv.per,r.p.name);if(paid){x.paid=true;x.paidAt=pv.date;x.amt=r.base}else{delete x.paid;delete x.paidAt;delete x.amt;delete x.fixed}});
  touch('p:'+ym);pv.sel.clear();renderPay();
}
const rowName=e=>e.target.closest('tr[data-n]')?.dataset.n;
$('#v-pay').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const n=rowName(e),ym=ymk(view.y,view.m);
  if(b.dataset.per){pv.per=+b.dataset.per;pv.sel.clear();renderPay()}
  else if(b.hasAttribute('data-pay'))doPay([n],true);
  else if(b.hasAttribute('data-cancel'))doPay([n],false);
  else if(b.hasAttribute('data-payall'))doPay(calc(ym,pv.per).rows.map(r=>r.p.name),true);
  else if(b.hasAttribute('data-paysel'))doPay([...pv.sel],true);
  else if(b.hasAttribute('data-cancelsel'))doPay([...pv.sel],false);
});
$('#v-pay').addEventListener('input',e=>{
  const f=e.target.dataset.pf;if(!f)return;const ym=ymk(view.y,view.m),x=payW(ym,pv.per,rowName(e));
  const v=parseAmt(e.target.value);if(v)x[f]=v;else delete x[f];touch('p:'+ym);refreshPay();
});
$('#v-pay').addEventListener('change',e=>{
  if(e.target.id==='paydate'){pv.date=e.target.value;return}
  if(e.target.dataset.pd!==undefined){const ym=ymk(view.y,view.m);if(e.target.value){payW(ym,pv.per,rowName(e)).paidAt=e.target.value;touch('p:'+ym)}return}
  if(e.target.id==='selall'){const P=calc(ymk(view.y,view.m),pv.per);pv.sel=new Set(e.target.checked?P.rows.filter(r=>!r.paid&&r.total).map(r=>r.p.name):[]);renderPay()}
  else if(e.target.hasAttribute('data-sel')){const n=rowName(e);e.target.checked?pv.sel.add(n):pv.sel.delete(n)}
});
</script>
<script>
/* ===== 6. 연간 현황 ===== */
const yv={mode:'sum',paidOnly:false};
function yearData(y){
  const map=new Map();
  for(let m=0;m<12;m++)for(const per of[1,2]){
    for(const r of calc(ymk(y,m),per).rows){
      let e=map.get(r.p.name);if(!e){e={p:r.p,mo:Array(12).fill(null)};map.set(r.p.name,e)}
      const a=e.mo[m]||(e.mo[m]={days:0,base:0,allow:0,alba:0,total:0});a.days+=r.days;
      if(!yv.paidOnly||r.paid){a.base+=r.base;a.allow+=r.allow;a.alba+=r.alba;a.total+=r.total}
    }
  }
  const g=groups();return[...map.values()].sort((a,b)=>g.indexOf(a.p.grp)-g.indexOf(b.p.grp));
}
const KEYS=['days','base','allow','alba','total'];
function yCell(a,p){
  if(!a)return`<span class="na">${p&&p.grp===S.cfg.seasonGroup?'미사용':'–'}</span>`;
  if(yv.mode==='sum')return`<div class="yc"><b class="${a.days?'':'na'}">${a.days?num(a.days)+'일':'–'}</b><small>${a.total?won(a.total):''}</small></div>`;
  const v=a[yv.mode];return v?(yv.mode==='days'?num(v)+'일':won(v)):'<span class="na">–</span>';
}
function renderYear(){
  const y=view.y,data=yearData(y),cm=y===NOW.getFullYear()?NOW.getMonth():-1;
  $('#title').textContent=`${y}년`;
  const sumAll=KEYS.map(k=>data.reduce((s,e)=>s+e.mo.reduce((t,a)=>t+(a?a[k]:0),0),0));
  const modes={sum:'종합 (일수·총액)',days:'근무일수',base:'급여',allow:'수당',alba:'알바비',total:'총 지급액'};
  let h=`<div class="sum"><div><small>연간 환산 근무일</small><b>${num(sumAll[0])}일</b></div><div><small>급여</small><b>₩${won(sumAll[1])}</b></div><div><small>수당</small><b>₩${won(sumAll[2])}</b></div><div><small>알바비</small><b>₩${won(sumAll[3])}</b></div><div class="okc"><small>총 지급액</small><b>₩${won(sumAll[4])}</b></div></div>
   <div class="bulk"><div class="seg2">${Object.entries(modes).map(([k,v])=>`<button data-ym="${k}" class="${yv.mode===k?'on':''}">${v}</button>`).join('')}</div>
   <label><input type="checkbox" id="paidOnly" ${yv.paidOnly?'checked':''}> 지급완료분만 집계</label><button class="sp" id="ycsv" style="margin-left:auto">CSV 내려받기</button></div>
   <div class="card tbl"><table class="ytbl"><thead><tr><th class="l c1">이름</th>${Array.from({length:12},(_,i)=>`<th class="${i===cm?'cur':''}">${i+1}월</th>`).join('')}<th class="tt">연 합계</th></tr></thead><tbody>`;
  groups().forEach(g=>{
    const es=data.filter(e=>e.p.grp===g);if(!es.length)return;
    h+=`<tr class="gr"><td class="c1" colspan="14">${esc(g)}</td></tr>`;
    es.forEach(e=>{
      const t=e.mo.reduce((s,a)=>{if(a)KEYS.forEach(k=>s[k]+=a[k]);return s},{days:0,base:0,allow:0,alba:0,total:0});
      h+=`<tr><td class="l c1"><b>${esc(e.p.name)}</b>${e.p.active===false?'<small>비활성</small>':''}</td>${e.mo.map((a,i)=>`<td class="${i===cm?'cur':''}">${yCell(a,e.p)}</td>`).join('')}<td class="tt">${yCell(t)}</td></tr>`;
    });
  });
  const colT=Array.from({length:12},(_,m)=>data.reduce((s,e)=>{const a=e.mo[m];if(a)KEYS.forEach(k=>s[k]+=a[k]);return s},{days:0,base:0,allow:0,alba:0,total:0}));
  const all=colT.reduce((s,a)=>{KEYS.forEach(k=>s[k]+=a[k]);return s},{days:0,base:0,allow:0,alba:0,total:0});
  $('#v-year').innerHTML=h+`</tbody><tfoot><tr><td class="l c1">월 합계</td>${colT.map(a=>`<td>${yCell(a)}</td>`).join('')}<td class="tt">${yCell(all)}</td></tr></tfoot></table></div>
   <div class="hint">금액은 근무기록 × 일당 + 수당 + 알바비 기준이며 계절근로를 비활성화한 기간은 '미사용'으로 표시됩니다.</div>`;
}
$('#v-year').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ym){yv.mode=b.dataset.ym;renderYear()}
  else if(b.id==='ycsv'){
    const rows=[['이름','구분',...Array.from({length:12},(_,i)=>[`${i+1}월 일수`,`${i+1}월 급여`,`${i+1}월 수당`,`${i+1}월 알바비`]).flat(),'합계 일수','합계 급여','합계 수당','합계 알바비','합계 총액']];
    yearData(view.y).forEach(e=>{const t=Array(5).fill(0);const cells=e.mo.flatMap(a=>{if(!a)return['','','',''];KEYS.forEach((k,i)=>t[i]+=a[k]);return[a.days,a.base,a.allow,a.alba]});rows.push([e.p.name,e.p.grp,...cells,...t])});
    dl(`연간현황-${view.y}.csv`,'﻿'+rows.map(r=>r.join(',')).join('\n'),'text/csv');
  }
});
$('#v-year').addEventListener('change',e=>{if(e.target.id==='paidOnly'){yv.paidOnly=e.target.checked;renderYear()}});
</script>
<script>
/* ===== 7. 설정 · 직원 · 백업 ===== */
function renderSettings(){
  const c=S.cfg,gl=groups();
  $('#v-set').innerHTML=`<div class="set">
  <div class="card"><h3>급여 기준</h3>
   <div class="f"><label>계절근로 일당(원)</label><input data-cfg="wageSeasonal" data-n inputmode="numeric" value="${c.wageSeasonal||''}"></div>
   <div class="f"><label>그 외 일당(원)</label><input data-cfg="wageOther" data-n inputmode="numeric" value="${c.wageOther||''}"></div>
   <div class="f"><label>시간제 환산 기준</label><input data-cfg="partBase" data-n inputmode="numeric" value="${c.partBase}"></div>
   <div class="hint">전일 1일, 반일 0.5일로 계산하고 시간제는 일당 ÷ 기준시간 × 근무시간으로 계산합니다. 사람별 일당은 아래 직원 표에서 따로 지정할 수 있습니다.</div></div>
  <div class="card"><h3>휴무일 · 계절근로</h3>
   <div class="f"><label>정기 휴무 요일</label><div class="days">${DOW.map((d,i)=>`<label><input type="checkbox" data-off="${i}" ${c.offDays.includes(i)?'checked':''}>${d}</label>`).join('')}</div></div>
   <div class="f"><label>계절근로 그룹</label><select data-cfg="seasonGroup">${gl.map(g=>`<option ${g===c.seasonGroup?'selected':''}>${esc(g)}</option>`).join('')}</select></div>
   <div class="f"><label>계절근로 활성화</label><label style="color:var(--ink)"><input type="checkbox" data-seas ${c.seasonOn!==false?'checked':''}> 사용 (체크 해제 시 입력 잠금·급여 대상 제외)</label></div>
   <div class="hint">특정 날짜만 휴무로 바꾸려면 캘린더에서 날짜를 선택해 '휴무일로 지정'을 누르세요.</div></div>
  <div class="card"><h3>그룹 표시 순서</h3>${gl.map((g,i)=>`<div class="gl"><span>${esc(g)}</span><button data-gm="${g}|-1" ${i?'':'disabled'}>▲</button><button data-gm="${g}|1" ${i<gl.length-1?'':'disabled'}>▼</button></div>`).join('')}</div>
  <div class="card"><h3>데이터</h3><div style="display:flex;gap:8px;flex-wrap:wrap">
   <button id="bk">백업 내려받기 (JSON)</button><label class="hint" style="margin:0">복원 <input type="file" id="rs" accept=".json"></label>
   ${HOSTED?'<button id="xs">구글 시트로 내보내기</button>':''}</div>
   <div class="hint">${HOSTED?'데이터는 구글 시트의 \'데이터\' 탭에 자동 저장됩니다. 내보내기는 보기 좋은 표(내보내기_근무 / 내보내기_급여 탭)를 새로 만듭니다.':'지금은 이 브라우저에만 저장됩니다.'}</div></div>
  <div class="card" style="grid-column:1/-1"><h3>직원 <button class="pri" id="addBtn" style="float:right;padding:3px 12px">+ 추가</button></h3>
   <div class="tbl"><table><thead><tr><th class="l">이름</th><th class="l">국적</th><th class="l">구분</th><th>개인 일당(선택)</th><th>활성</th></tr></thead><tbody>
   ${S.staff.map((p,i)=>`<tr data-i="${i}"><td class="l"><b>${esc(p.name)}</b></td><td class="l"><input data-sf="nat" value="${esc(p.nat)}" style="width:90px"></td>
    <td class="l"><input data-sf="grp" list="grpList" value="${esc(p.grp)}" style="width:90px"></td><td><input class="amt" data-sf="wage" inputmode="numeric" value="${p.wage||''}" placeholder="기본값"></td>
    <td><input type="checkbox" data-sf="active" ${p.active!==false?'checked':''}></td></tr>`).join('')}</tbody></table></div>
   <div class="hint">퇴사자는 삭제하지 말고 '활성'을 해제하세요. 과거 기록과 급여 내역이 그대로 유지됩니다.</div></div></div>`;
  $('#grpList').innerHTML=gl.map(g=>`<option value="${esc(g)}">`).join('');
}
$('#v-set').addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.cfg){const k=t.dataset.cfg;S.cfg[k]=t.hasAttribute('data-n')?parseAmt(t.value):isNaN(t.value)?t.value:+t.value;touch('cfg');renderSettings()}
  else if(t.hasAttribute('data-seas')){S.cfg.seasonOn=t.checked;touch('cfg');renderSettings()}
  else if(t.hasAttribute('data-off')){const s=new Set(S.cfg.offDays);t.checked?s.add(+t.dataset.off):s.delete(+t.dataset.off);S.cfg.offDays=[...s].sort();touch('cfg')}
  else if(t.dataset.sf){
    const p=S.staff[t.closest('tr').dataset.i],f=t.dataset.sf;
    p[f]=f==='active'?t.checked:f==='wage'?parseAmt(t.value)||0:t.value.trim();touch('staff');renderSettings();
  }
  else if(t.id==='rs')restore(t.files[0]);
});
$('#v-set').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.gm){const[g,d]=b.dataset.gm.split('|');moveGroup(g,+d);renderSettings()}
  else if(b.id==='addBtn')$('#dlg').showModal();
  else if(b.id==='bk')dl(`인력관리-백업-${TODAY}.json`,JSON.stringify({v:2,staff:S.staff,cfg:S.cfg,months:S.months,pays:S.pays}),'application/json');
  else if(b.id==='xs')exportSheets();
});
$('#addForm').addEventListener('submit',e=>{
  if(e.submitter.value!=='ok')return;
  const name=$('#aName').value.trim();
  if(!name||S.staff.some(p=>p.name===name)){alert('이름이 비어있거나 이미 존재합니다.');e.preventDefault();return}
  S.staff.push({name,nat:$('#aNat').value.trim(),grp:$('#aGrp').value.trim(),active:true});
  touch('staff');e.target.reset();renderAll();
});
function restore(f){
  if(!f)return;
  f.text().then(t=>{
    const d=JSON.parse(t);if(!d.staff||!d.months)throw 0;
    if(!confirm('현재 데이터를 백업 파일 내용으로 덮어쓸까요?'))return;
    S.staff=d.staff;S.cfg={...DEFAULT_CFG,...d.cfg};S.months=d.months;S.pays=d.pays||{};allKeys().forEach(touch);renderAll();
  }).catch(()=>alert('올바른 백업 파일이 아닙니다. (구버전 백업은 복원할 수 없습니다)'));
}
async function exportSheets(){
  const work=[['날짜','이름','구분','근무형태','시간','메모']],pay=[['월','지급기준','이름','구분','전일','반일','시간제(일)','시간제(시간)','일당','급여','수당','알바비','합계','지급여부','지급일']];
  Object.keys(S.months).sort().forEach(ym=>{
    const rec=S.months[ym].rec;
    Object.keys(rec).sort().forEach(d=>S.staff.forEach(p=>{const x=rec[d][p.name];if(x)work.push([d,p.name,p.grp,TYPES[x.t],x.h||'',x.m||''])}));
  });
  [...new Set([...Object.keys(S.months),...Object.keys(S.pays)])].sort().forEach(ym=>[1,2].forEach(per=>{
    const P=calc(ym,per);P.rows.forEach(r=>{if(r.total||r.days)pay.push([ym,per===1?'15일':'말일',r.p.name,r.p.grp,r.full,r.half,r.part,r.hours,r.wage,r.base,r.allow,r.alba,r.total,r.paid?'지급':'미지급',r.paidAt])});
  }));
  try{setSync('busy');await gs('apiExport',{'내보내기_근무':work,'내보내기_급여':pay});setSync('ok');alert('구글 시트에 내보냈습니다.')}catch(e){setSync('err',e.message);alert('내보내기 실패: '+e.message)}
}
</script>
<script>
/* ===== 8. 화면 전환 · 초기화 ===== */
function setTab(t){tab=t;renderAll()}
function renderAll(){
  for(const t of['cal','pay','year','set'])$('#v-'+t).hidden=t!==tab;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('#bar').hidden=tab==='set';$('#legend').hidden=tab!=='cal';
  if(tab==='cal'){renderCal();renderPanel()}else if(tab==='pay')renderPay();else if(tab==='year')renderYear();else renderSettings();
}
function step(k){
  if(tab==='year')view.y+=k;
  else{const d=new Date(view.y,view.m+k,1);view={y:d.getFullYear(),m:d.getMonth()};
    sel=view.y===NOW.getFullYear()&&view.m===NOW.getMonth()?TODAY:ymd(view.y,view.m,1);pv.sel.clear()}
  renderAll();
}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab)};
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
$('#today').onclick=()=>{view={y:NOW.getFullYear(),m:NOW.getMonth()};sel=TODAY;renderAll()};
$('#sync').onclick=()=>{if(!HOSTED)return;dirty.size?flush():pull().then(renderAll)};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){cacheNow();flush()}
  else if(HOSTED&&!dirty.size&&!flushing)pull().then(()=>{if(!document.activeElement||!/INPUT|TEXTAREA/.test(document.activeElement.tagName))renderAll()});
});
loadLocal();
setSync(HOSTED?'load':'local');
renderAll();
pull().then(renderAll);
</script>
</body>
